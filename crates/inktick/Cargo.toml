[package]
name = "inktick"
description = "A Game & Watch emulator: Sharp SM510-family LCD games, on nibOS, the RG DS+'s stock OS and desktops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
inktick-core = { path = "../inktick-core" }
inktick-art = { path = "../inktick-art" }
inktick-sets = { path = "../inktick-sets" }
# nibOS's SDK library (github.com/abradburne/nibkit, MIT): the screens, vblank, buttons, touch,
# brightness, paths, settings, the shared menu and DSlot's description format. To build against a
# local checkout, patch it in from outside the repository (CONTRIBUTING.md, "nibkit").
nibkit = { git = "https://github.com/abradburne/nibkit", tag = "v0.4.1", version = "0.4", default-features = false, features = ["menu-raster"] }
# SDL2's API, linked against the system's SDL2 (sdl2-compat on SDL3), as DSlot does.
sdl2 = "0.38"
glow = "0.14"
png = "0.17"
libc = "0.2"

# The system it runs on, one of them (as nibkit's): nibOS (the default), the RG DS+'s stock OS,
# or a computer. `dslot` adds DSlot's part: options kept in DSlot's settings file, and a test
# that the description DSlot reads matches inktick's options. inktick runs without DSlot either way.
[features]
default = ["nibos"]
# On nibOS the menu has the Connections page (Wi-Fi, Bluetooth), which needs nibkit's radios.
nibos = ["nibkit/nibos", "nibkit/net-control"]
stock = ["nibkit/stock"]
# A computer: windows, keyboard, mouse (nibkit chooses it anyway on any system but Linux).
desktop = ["nibkit/desktop"]
dslot = ["nibkit/dslot"]

# The core forbids unsafe code; the program needs it for GL and a few libc calls, each with a
# SAFETY comment saying why it holds.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "allow"
