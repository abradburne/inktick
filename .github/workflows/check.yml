# inktick: `make check` on every push and pull request: rustfmt, clippy -D warnings for each
# system inktick builds for (nibOS, nibOS with DSlot, the stock OS, a computer), every test, and
# shellcheck. The tests that need the units' sets skip: no set is in the repository. nibkit comes
# from its own repository, as Cargo.toml says.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev shellcheck
          rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: make check
        run: make check
